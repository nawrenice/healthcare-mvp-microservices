# Local synthetic-data demo. H2 data resets on restart. Bind ports to loopback only.
services:
  auth-service:
    build:
      context: .
      args: { SERVICE: auth-service }
    environment: { SPRING_PROFILES_ACTIVE: demo }
    ports: ["127.0.0.1:8081:8081"]
  user-service:
    build:
      context: .
      args: { SERVICE: user-service }
    environment: { SPRING_PROFILES_ACTIVE: demo }
    ports: ["127.0.0.1:8082:8082"]
  doctor-service:
    build:
      context: .
      args: { SERVICE: doctor-service }
    environment: { SPRING_PROFILES_ACTIVE: demo }
    ports: ["127.0.0.1:8083:8083"]
  appointment-service:
    build:
      context: .
      args: { SERVICE: appointment-service }
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SERVICES_DOCTOR_URL: http://doctor-service:8083
    ports: ["127.0.0.1:8084:8084"]
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on: [auth-service, user-service, doctor-service, appointment-service]
