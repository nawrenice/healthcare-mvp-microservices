
# ===============================
# Application Identity
# ===============================
spring.application.name=user-service




# ===============================
# Server Configuration
# ===============================

# Port where user-service runs (avoid 8080 for gateway later)
server.port=8082


# ===============================
# MySQL Database Configuration
# ===============================

# JDBC URL to connect to MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_user_db?useSSL=false&serverTimezone=UTC


# Database username (uses env variable if set, otherwise 'root')
spring.datasource.username=${DB_USERNAME:root}

# Database password (avoid hardcoding in real projects)
spring.datasource.password=${DB_PASSWORD:root}

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===============================
# JPA / Hibernate Configuration
# ===============================


# Auto-creates/updates tables based on entities (good for development)
spring.jpa.hibernate.ddl-auto=update


# Prints SQL queries in console (useful for learning/debugging)
spring.jpa.show-sql=true


# Formats SQL output for readability
spring.jpa.properties.hibernate.format_sql=true




# ===============================
# Swagger / OpenAPI Configuration
# ===============================

springdoc.api-docs.path=/v3/api-docs
# Path to OpenAPI JSON

springdoc.swagger-ui.path=/swagger-ui.html
# Swagger UI endpoint

jwt.secret=your-very-long-secret-key-your-very-long-secret-key
jwt.expiration=86400000


