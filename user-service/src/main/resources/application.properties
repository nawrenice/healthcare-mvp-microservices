# Each service owns its database. Environment variables let Compose supply hostnames.
spring.application.name=user-service
server.port=8082
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_user_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Development schema management; use reviewed migrations before production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# No committed signing key. All services must receive the same key (at least 32 bytes).
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
