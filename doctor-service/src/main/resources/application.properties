



# ===============================
# Application Identity
# ===============================

# Name of the microservice (used in logs, service discovery later)
spring.application.name=doctor-service



# ===============================
# Server Configuration
# ===============================

# Port where auth-service runs (avoid 8080 for gateway later)
server.port=8083


# ===============================
# MySQL Database Configuration
# ===============================

# JDBC URL to connect to MySQL database
#spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_doctor_db?useSSL=false&serverTimezone=UTC

spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_doctor_db?allowPublicKeyRetrieval=true&useSSL=false


# Database username (uses env variable if set, otherwise 'root')
spring.datasource.username=${DB_USERNAME:root}

# Database password (avoid hardcoding in real projects)
spring.datasource.password=${DB_PASSWORD:root}

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ===============================
# JPA / Hibernate Configuration
# ===============================


# Auto-creates/updates tables based on entities (good for development)
spring.jpa.hibernate.ddl-auto=update


# Prints SQL queries in console (useful for learning/debugging)
spring.jpa.show-sql=true


# Formats SQL output for readability
spring.jpa.properties.hibernate.format_sql=true



# Optimizes Hibernate for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect



# ===============================
# Connection Pool (HikariCP)
# ===============================

spring.datasource.hikari.maximum-pool-size=10
# Maximum number of DB connections in pool

spring.datasource.hikari.minimum-idle=5
# Minimum idle connections kept ready


# ===============================
# Logging (Hibernate SQL Debugging)
# ===============================

logging.level.org.hibernate.SQL=DEBUG
# Logs SQL queries

logging.level.org.hibernate.type.descriptor.sql=TRACE
# Logs query parameter values


# ===============================
# Swagger / OpenAPI Configuration
# ===============================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.api-docs.path=/api-docs
# Path to OpenAPI JSON

springdoc.swagger-ui.path=/swagger-ui.html
# Swagger UI endpoint


#
#What this means
#jwt.secret = signing key used to sign token
#jwt.expiration = token lifetime in milliseconds
#86400000 = 24 hours
# Must match Auth Service JWT secret so Doctor Service can validate tokens created during login.
jwt.secret=your-very-long-secret-key-your-very-long-secret-key
jwt.expiration=86400000