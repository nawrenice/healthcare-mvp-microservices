# The gateway routes traffic; each Java service still verifies JWTs and ownership.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    resolver 127.0.0.11 valid=10s;
    # Runtime resolution tolerates a service restarting with a new container IP.
    location /api/auth/ { set $auth http://auth-service:8081; proxy_pass $auth$request_uri; }
    location /api/user-profiles { set $users http://user-service:8082; proxy_pass $users$request_uri; }
    location /api/doctors { set $doctors http://doctor-service:8083; proxy_pass $doctors$request_uri; }
    location /api/appointments { set $appointments http://appointment-service:8084; proxy_pass $appointments$request_uri; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
